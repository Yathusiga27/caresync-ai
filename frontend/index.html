<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const mode = localStorage.getItem('caresync-appearance')
        if (mode === 'light' || mode === 'dark') document.documentElement.dataset.appearance = mode
      } catch {}
    </script>
    <meta name="description" content="CareSync AI family supervision workspace." />
    <title>CareSync AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
